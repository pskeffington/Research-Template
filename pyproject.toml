[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-template-kit"
version = "0.1.0"
description = "Reproducible research starter with synthetic examples, plotting and optional machine learning"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Paul Skeffington"}]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.8,<4", "numpy>=1.26,<3"]
ml = ["scikit-learn>=1.5,<2", "numpy>=1.26,<3"]
torch = ["torch>=2.3,<3", "numpy>=1.26,<3"]
dev = ["pytest>=8,<10", "ruff>=0.7,<1"]
all = ["matplotlib>=3.8,<4", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "pytest>=8,<10", "ruff>=0.7,<1"]

[project.scripts]
research-template = "research_template.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_template = ["packs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
