name: Research scaffold CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install declared tools
        run: python -m pip install -e '.[all]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Validate sourced journal policies and reporting-guideline applicability
        run: python -m unittest discover -s scripts/tests -p 'test_journal_policy_matrix.py' -v
      - name: Verify opt-in study initializer, secured output paths and research-sector catalog
        run: |
          research-template init-study --out artifacts/onboarding \
            --title "Independent Test Study" --objective descriptive \
            --analysis-unit "one observation"
          research-template check-study --root artifacts/onboarding
          research-template pack list
          research-template pack plan --id nhanes-2017-2018
          research-template sectors list
          research-template sectors plan --id SGN-02
          pytest -q tests/test_study_scaffold.py tests/test_study_packs.py tests/test_sector_catalog.py
          git check-ignore artifacts/onboarding/study.json
      - name: Generate and validate each public oncology sector starter without research data
        run: |
          research-template sectors recipes
          research-template sectors scaffold --id CPS-02 --out artifacts/starter-cps
          research-template sectors scaffold --id SGN-02 --out artifacts/starter-sgn
          research-template sectors scaffold --id ICI-02 --out artifacts/starter-ici
          research-template sectors scaffold --id TEC-01 --out artifacts/starter-tec
          for sector in cps sgn ici tec; do
            research-template sectors check-scaffold --root "artifacts/starter-$sector"
          done
          pytest -q tests/test_sector_starters.py
          git check-ignore artifacts/starter-sgn/VARIABLE_MAPPING.csv
      - name: Execute synthetic demonstration
        run: research-template demo --out artifacts/ci --seed 711 --plots --ml
      - name: Audit synthetic biomedical lexical retrieval baseline
        run: |
          research-template rag-demo --out artifacts/rag/ci_retrieval.json --top-k 2
          python -m research_template.retrieval_eval \
            --out artifacts/rag/ci_direct.json --top-k 2
      - name: Confirm scaffold completeness (not clinical approval)
        run: research-template audit --root .
      - name: Verify sample outputs are ignored
        run: |
          git check-ignore artifacts/ci/run_manifest.json
          git diff --exit-code

  r-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install R and tidyverse core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-ggplot2 r-cran-dplyr r-cran-tidyr r-cran-tibble r-cran-readr r-bioc-complexheatmap r-cran-circlize r-cran-png r-cran-digest r-cran-jsonlite r-cran-plotly r-cran-htmlwidgets r-cran-caret poppler-utils fonts-dejavu-core
      - name: Install PDF vector geometry inspector
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "PyMuPDF==1.26.7" "Pillow==12.0.0"
      - name: Check all R modules
        run: Rscript --vanilla R/tests/test_style_contract.R
      - name: Validate documented R examples
        run: Rscript --vanilla R/tests/test_documentation_examples.R
      - name: Test tidyverse joins, pivots, summaries and ggplot
        run: Rscript --vanilla R/tests/test_tidy_workflow.R
      - name: Validate caret grouped classification and holdout metrics
        run: Rscript --vanilla R/tests/test_caret_workflow.R
      - name: Audit pinned caret algorithm metadata, lists and tuning grids
        run: Rscript --vanilla R/tests/test_caret_algorithm_catalog.R
      - name: Test R summary and scientific plots
        run: Rscript --vanilla R/tests/test_research_plots.R
      - name: Test manuscript PDF and PNG delivery
        run: Rscript --vanilla R/tests/test_manuscript_delivery.R
      - name: Test ordered heatmap and interactive guards
        run: Rscript --vanilla R/tests/test_research_interactive.R
      - name: Test inferential plotting contracts
        run: Rscript --vanilla R/tests/test_inference_plots.R
      - name: Test ComplexHeatmap rendering and sample alignment
        run: Rscript --vanilla R/tests/test_complex_heatmap.R
      - name: Generate and structurally audit synthetic manuscript references
        run: Rscript --vanilla R/tests/generate_manuscript_review.R
      - name: Test actual Plotly HTML creation and release guards
        run: Rscript --vanilla R/tests/test_plotly_export.R
      - name: Reject corrupted or scientifically unapproved figure artifacts
        run: Rscript --vanilla R/tests/test_figure_audit_negative.R
      - name: Upload synthetic figure-review examples (not release-approved)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-manuscript-review
          path: artifacts/ci_figure_review/
          retention-days: 14
          if-no-files-found: warn
      - name: Confirm R exports ignored
        run: git check-ignore artifacts/r_ci/test_plot.pdf
