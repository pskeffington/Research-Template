name: Research scaffold CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install declared tools
        run: python -m pip install -e '.[all]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Execute synthetic demonstration
        run: research-template demo --out artifacts/ci --seed 711 --plots --ml
      - name: Confirm scaffold completeness (not clinical approval)
        run: research-template audit --root .
      - name: Verify sample outputs are ignored
        run: |
          git check-ignore artifacts/ci/run_manifest.json
          git diff --exit-code

  r-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # pinned v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install plotting package
        run: Rscript --vanilla -e 'install.packages("ggplot2", repos="https://cloud.r-project.org")'
      - name: Test R summary and all charts
        run: Rscript --vanilla R/tests/test_research_plots.R
      - name: Confirm R exports ignored
        run: git check-ignore artifacts/r_ci/test_plot.pdf
