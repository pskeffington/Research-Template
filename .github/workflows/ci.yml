name: Research scaffold CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install declared tools
        run: python -m pip install -e '.[all]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Execute synthetic demonstration
        run: research-template demo --out artifacts/ci --seed 711 --plots --ml
      - name: Confirm scaffold completeness (not clinical approval)
        run: research-template audit --root .
      - name: Verify sample outputs are ignored
        run: |
          git check-ignore artifacts/ci/run_manifest.json
          git diff --exit-code

  r-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install R and tidyverse core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-ggplot2 r-cran-dplyr r-cran-tidyr r-cran-tibble r-cran-readr
      - name: Check R style contract
        run: Rscript --vanilla R/tests/test_style_contract.R
      - name: Test tidyverse joins, pivots, summaries and ggplot
        run: Rscript --vanilla R/tests/test_tidy_workflow.R
      - name: Test R summary and scientific plots
        run: Rscript --vanilla R/tests/test_research_plots.R
      - name: Confirm R exports ignored
        run: git check-ignore artifacts/r_ci/test_plot.pdf
